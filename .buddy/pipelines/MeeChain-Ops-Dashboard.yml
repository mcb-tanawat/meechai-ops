- pipeline: meechain-ops-dashboard
  name: MeeChain-Ops-Dashboard
  refs:
  - refs/heads/main
  fail_on_prepare_env_warning: true
  events:
  - type: WEBHOOK
  - type: ENVIRONMENT_CREATE
    environments:
    - '*'
  actions:
  - action: $BUDDY_ACTION_RUN_LOOP_I
    type: VM_LINUX
    loop:
    - /.buddy
    commands: |-
      echo "=== ENV-BASE-002 CURRENT RECORD ==="
      cat .buddy/environments/ENV-BASE-002.yml

      echo
      echo "=== PIPELINE ENVIRONMENT REFERENCES ==="
      grep -RniE \
        'environment|base_only|distribution|ENV-BASE|env-base|inherit|permission' \
        .buddy/pipelines .buddy/distributions \
        --include='*.yml' --include='*.yaml'
    vm_from_prev_action: true
    instance_type: GENERAL_MEDIUM
    mount_paths:
    - pipeline_path: /.buddy/
      vm_path: /buddy
